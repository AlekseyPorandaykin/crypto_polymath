services:
  app-external-v1:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    ports:
      - "8080:8080"
      - "8085:8085"
      - "80:80"
    environment:
      - METRIC_PORT=8080
      - CGO_ENABLED=0
      - DB_CONNECTION_HOST=postgres
      - DB_CONNECTION_PORT=5432
    command:
      - "api"
      - "external-v1"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  app-loader:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    environment:
      - METRIC_PORT=8081
      - GRPC_PORT=50052
      - CGO_ENABLED=0
      - DB_CONNECTION_HOST=postgres
      - DB_CONNECTION_PORT=5432
    ports:
      - "8081:8081"
      - "50052:50052"
    command:
      - "daemon"
      - "loader"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  app-calculator:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    environment:
      - METRIC_PORT=8082
      - CGO_ENABLED=0
      - DB_CONNECTION_HOST=postgres
      - DB_CONNECTION_PORT=5432
    ports:
      - "8082:8082"
    command:
      - "daemon"
      - "calculator"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8090:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
  postgres:
    image: postgres
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.50'     # максимум 50% одного CPU
          memory: 512M     # максимум 512 мегабайт
        reservations:
          cpus: '0.25'     # желательно 25% CPU
          memory: 256M     # желательно 256Мб
    restart: unless-stopped         # политика рестарта
    ports:
      - "3307:3306"
      - "5433:5432"
    environment:
      POSTGRES_DB: crypto_app
      POSTGRES_USER: crypto_app
      POSTGRES_PASSWORD: crypto_developer
      PGDATA: /data/pgdata
    volumes:
      - /projects/storage:/data/pgdata
    networks:
      - application
networks:
  application:
    driver: bridge

services:
  app-external-v1:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    ports:
      - "8080:8080"
      - "8085:8085"
      - "80:80"
    environment:
      - METRIC_PORT=8080
      - CGO_ENABLED=0
      - DB_CONNECTION_HOST=postgres
      - DB_CONNECTION_PORT=5432
    command:
      - "api"
      - "external-v1"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  app-loader:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    environment:
      - METRIC_PORT=8081
      - GRPC_PORT=50052
      - CGO_ENABLED=0
      - DB_CONNECTION_HOST=postgres
      - DB_CONNECTION_PORT=5432
    ports:
      - "8081:8081"
      - "50052:50052"
    command:
      - "daemon"
      - "loader"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  app-calculator:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    environment:
      - METRIC_PORT=8082
      - CGO_ENABLED=0
      - DB_CONNECTION_HOST=postgres
      - DB_CONNECTION_PORT=5432
    ports:
      - "8082:8082"
    command:
      - "daemon"
      - "calculator"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8090:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
  postgres:
    image: postgres
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: '0.50'     # максимум 50% одного CPU
          memory: 512M     # максимум 512 мегабайт
        reservations:
          cpus: '0.25'     # желательно 25% CPU
          memory: 256M     # желательно 256Мб
    restart: unless-stopped         # политика рестарта
    ports:
      - "3307:3306"
      - "5433:5432"
    environment:
      POSTGRES_DB: crypto_app
      POSTGRES_USER: crypto_app
      POSTGRES_PASSWORD: crypto_developer
      PGDATA: /data/pgdata
    volumes:
      - /projects/storage:/data/pgdata
    healthcheck: # Проверка состояния для PostgreSQL
      test: [ "CMD-SHELL", "pg_isready -U crypto_app -d crypto_app" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - application
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:master
    restart: unless-stopped
    environment:
      # Важно: Host должен быть именем сервиса PostgreSQL (db в данном случае)
      DATA_SOURCE_NAME: "postgresql://crypto_app:crypto_developer@postgres:5432/crypto_app?sslmode=disable"
    ports:
      - "9187:9187" # Порт по умолчанию для postgres_exporter
    depends_on:
      postgres:
        condition: service_healthy # Запускать экспортер только после того, как PostgreSQL готов
    command:
      - "--web.listen-address=:9187"
      # - "--collect.database=mydatabase" # Можно указать конкретную БД, если DATA_SOURCE_NAME не хватает
      # - "--collect.schema_privileges" # Пример: включить сбор метрик привилегий по схемам
      # - "--exclude-pattern=^pg_temp_" # Пример: исключить временные схемы
    networks:
      - application

networks:
  application:
    driver: bridge

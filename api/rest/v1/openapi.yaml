openapi: 3.0.3
info:
  title: Crypto Polymath REST API
  description: Crypto Polymath REST api for external services.
  version: 1.0.0
  contact:
    name: Alexey Porandaikin
    email: porandaikinaleksei@gmail.com

servers:
  - url: localhost/api/v1
    description: Local server for development
  - url: http://www.cryptopolymath.org/api/v1
    description: Production server

paths:
  /server:
    get:
      summary: Server information
      tags:
        - info
      responses:
        200:
          description: Get server info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfoResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /prices/exchange/{exchange}:
    get:
      summary: Last exchange price
      tags:
        - price
      parameters:
        - in: path
          name: exchange
          description: name exchange
          schema:
            type: string
          required: true
      responses:
        200:
          description: return last prices for exchange
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesResponse'
              examples:
                normal:
                  $ref: '#/components/examples/PricesResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /prices/symbol/{symbol}:
    get:
      summary: Last prices
      tags:
        - price
      parameters:
        - in: path
          name: symbol
          description: name symbol
          schema:
            type: string
          required: true
      responses:
        200:
          description: return last prices from all exchanges for symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricesResponse'
              examples:
                normal:
                  $ref: '#/components/examples/PricesResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /price/{exchange}/{symbol}:
    get:
      summary: Last symbol price
      tags:
        - price
      parameters:
        - in: path
          name: exchange
          description: name exchange
          schema:
            type: string
          required: true
        - in: path
          name: symbol
          description: name symbol
          schema:
            type: string
          required: true
      responses:
        200:
          description: return last price for exchange and symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceResponse'
              examples:
                normal:
                  $ref: '#/components/examples/PriceResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /candlestick/{exchange}/{symbol}/{unit}/{interval}:
    get:
      summary: Last candlesticks
      tags:
        - candlestick
      parameters:
        - in: path
          name: exchange
          description: name exchange
          schema:
            type: string
          required: true
        - in: path
          name: symbol
          description: name symbol
          schema:
            type: string
          required: true
        - in: path
          name: interval
          description: interval value
          schema:
            type: string
          required: true
        - in: path
          name: unit
          description: unit value
          schema:
            type: string
            enum:
              - m
              - H
              - D
              - W
              - M
          required: true
      responses:
        200:
          description: return last candlesticks for exchange
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandlesticksResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /indicator/{exchange}/{symbol}/{unit}/{interval}/{name}/{depth}:
    get:
      summary: Last indicators
      tags:
        - indicator
      parameters:
        - in: path
          name: exchange
          description: name exchange
          schema:
            type: string
          required: true
        - in: path
          name: symbol
          description: name symbol
          schema:
            type: string
          required: true
        - in: path
          name: unit
          description: unit value
          schema:
            type: string
            enum:
              - m
              - H
              - D
              - W
              - M
          required: true
        - in: path
          name: interval
          description: interval value
          schema:
            type: integer
          required: true
        - in: path
          name: name
          description: name indicator
          schema:
            type: string
            enum:
              - Trend
              - MA
              - EMA
              - TypeCandle
              - VolatilityCandlePercent
              - PriceChanges
              - StochasticMainLine
          required: true
        - in: path
          name: depth
          description: depth indicator
          schema:
            type: integer
            enum:
              - 1
              - 3
              - 9
              - 10
              - 12
              - 14
              - 20
              - 26
              - 50
          required: true
      responses:
        200:
          description: return last candlesticks for exchange
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndicatorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /candle-indicator/{exchange}/{symbol}/{unit}/{interval}/{name}:
    get:
      summary: Last candle-indicators
      tags:
        - indicator
      parameters:
        - in: path
          name: exchange
          description: name exchange
          schema:
            type: string
          required: true
        - in: path
          name: symbol
          description: name symbol
          schema:
            type: string
          required: true
        - in: path
          name: unit
          description: unit value
          schema:
            type: string
            enum:
              - m
              - H
              - D
              - W
              - M
          required: true
        - in: path
          name: interval
          description: interval value
          schema:
            type: integer
          required: true
        - in: path
          name: name
          description: name indicator
          schema:
            type: string
            enum:
              - HeikenAshi
          required: true
      responses:
        200:
          description: return last candlesticks for exchange
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandleIndicatorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /exchange/{exchange}/{symbol}:
    get:
      summary: Symbol info
      tags:
        - symbol
      parameters:
        - in: path
          name: exchange
          description: name exchange
          schema:
            type: string
          required: true
        - in: path
          name: symbol
          description: name symbol
          schema:
            type: string
          required: true
      responses:
        200:
          description: return symbol info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymbolInfoResponse'
        404:
          description: not found symbol
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /analysis/{exchange}/{symbol}/{unit}/{interval}/{name}/{indicator_depth}/{depth}:
    get:
      summary: Last analysis
      parameters:
        - in: path
          name: exchange
          description: name exchange
          schema:
            type: string
          required: true
        - in: path
          name: symbol
          description: name symbol
          schema:
            type: string
          required: true
        - in: path
          name: unit
          description: unit value
          schema:
            type: string
            enum:
              - m
              - H
              - D
              - W
              - M
          required: true
        - in: path
          name: interval
          description: interval value
          schema:
            type: integer
          required: true
        - in: path
          name: name
          description: name analysis
          schema:
            type: string
            enum:
              - TrendByMA
              - TrendByEMA
              - RatioCandleToMA
              - RatioCandleToEMA
              - RSI
              - MACDMainLine
              - MACDSignalLine
              - MACDSHistogram
              - StochasticSignalLine
          required: true
        - in: path
          name: indicator_depth
          description: depth indicator
          schema:
            type: integer
            enum:
              - 1
              - 9
              - 10
              - 12
              - 14
              - 20
              - 26
              - 50
          required: true
        - in: path
          name: depth
          description: depth analysis
          schema:
            type: integer
            enum:
              - 1
              - 3
              - 9
              - 10
              - 12
              - 14
              - 20
              - 26
              - 50
          required: true
      tags:
        - analysis
      responses:
        200:
          description: return analysis data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResponse'
        404:
          description: not found symbol
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /symbols/{exchange}/{category}:
    get:
      summary: Symbol infos
      tags:
        - symbol
      parameters:
        - in: path
          name: exchange
          description: name exchange
          schema:
            type: string
          required: true
        - in: path
          name: category
          description: category symbol
          schema:
            type: string
            enum:
              - spot
              - future
          required: true
      responses:
        200:
          description: return symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SymbolInfoResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/avg-entry-price:
    post:
      tags:
        - calculator
      summary: Средняя цена входа после докупки по объёму
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingAvgEntryPriceRequest'
      responses:
        200:
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingAvgEntryPriceResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/avg-entry-price-by-sum:
    post:
      tags:
        - calculator
      summary: Средняя цена входа после докупки на сумму залога
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingAvgEntryPriceBySumRequest'
      responses:
        200:
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingAvgEntryPriceResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/volume-from-margin:
    post:
      tags:
        - calculator
      summary: Объём позиции из залога и плеча
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingVolumeFromMarginRequest'
      responses:
        200:
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingVolumeResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/liquidation-price:
    post:
      tags:
        - calculator
      summary: Цена ликвидации изолированной позиции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingLiquidationPriceRequest'
      responses:
        200:
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingLiquidationPriceResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/unrealized-pnl:
    post:
      tags:
        - calculator
      summary: Нереализованный PnL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingUnrealizedPnLRequest'
      responses:
        200:
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingUnrealizedPnLResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/distance-to-liquidation:
    post:
      tags:
        - calculator
      summary: Запас до ликвидации в процентах
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingDistanceToLiquidationRequest'
      responses:
        200:
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingDistanceToLiquidationResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/simulate-add-on:
    post:
      tags:
        - calculator
      summary: Симуляция докупки (вход, ликвидация, риски)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingSimulateAddOnRequest'
      responses:
        200:
          description: Результат симуляции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingAddOnResultResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/risk-at-price:
    post:
      tags:
        - calculator
      summary: Снимок риска позиции при рыночной цене
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingRiskAtPriceRequest'
      responses:
        200:
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingRiskSnapshotResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /calculator/trading/spot-pnl:
    post:
      tags:
        - calculator
      summary: PnL спотовой позиции в значении и в процентах
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TradingSpotPnLRequest'
      responses:
        200:
          description: Результат расчёта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradingSpotPnLResponse'
        400:
          description: Некорректные параметры
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    AnalysisResponse:
      type: array
      items:
        $ref: '#/components/schemas/AnalysisItem'
    AnalysisItem:
      type: object
      required: [ datetime,  value ]
      properties:
        datetime:
          type: string
          format: date-time
        value:
          type: number
    ServerInfoResponse:
      type: object
      required: [ time, symbols, exchanges, units, intervals, depths, indicator_depth, indicators, analysis ]
      properties:
        time:
          type: string
          format: date-time
        symbols:
          type: array
          items:
            type: string
            description: Support symbol
        exchanges:
          type: array
          items:
            type: string
            description: Support exchange
        units:
          type: array
          items:
            type: string
            description: Support unit
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/UnitIntervals'
        depths:
          type: array
          items:
            type: integer
            description: Support depth
        indicator_depth:
          type: array
          items:
            type: integer
            description: Support indicator depth
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorInfo'
        analysis:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisInfo'
    AnalysisInfo:
      type: object
      required:
        - name
        - description
        - depth
        - indicator_depth
      properties:
        name:
          type: string
          description: Name analysis
        description:
          type: string
        depth:
          type: array
          items:
            type: integer
            description: Depth analysis
        indicator_depth:
          type: array
          items:
            type: integer
            description: Depth indicator
    IndicatorInfo:
      type: object
      required:
        - name
        - description
        - depth
      properties:
        name:
          type: string
          description: Name indicator
        description:
          type: string
        depth:
          type: array
          items:
            type: integer
            description: Depth indicators
    UnitIntervals:
      type: object
      description: Support interval
      required:
        - unit
        - values
      properties:
        unit:
          type: string
          description: Unit value
        values:
          type: array
          items:
            type: integer
            description: Support interval value
    ErrorResponse:
      type: object
      required: [ message ]
      properties:
        message:
          type: string
    CandlesticksResponse:
      type: array
      items:
        $ref: '#/components/schemas/CandlestickItem'
    IndicatorResponse:
      type: array
      items:
        $ref: '#/components/schemas/IndicatorItem'
    CandleIndicatorResponse:
      type: array
      items:
        $ref: '#/components/schemas/CandleIndicatorItem'
    CandleIndicatorItem:
      type: object
      required: [ start_time, open_price, high_price, low_price, close_price,size_body_in_percent , size_body, close_location, open_location, direction ]
      properties:
        start_time:
          type: string
          format: date-time
        open_price:
          type: number
        high_price:
          type: number
        low_price:
          type: number
        close_price:
          type: number
        size_body_in_percent:
          type: number
        size_body:
          type: number
        close_location:
          type: number
        open_location:
          type: number
        direction:
          type: integer
          enum:
            - -1
            - 0
            - 1
    CandlestickItem:
      type: object
      required: [ start_time, open_price, high_price, low_price, close_price, volume, size_body_in_percent, close_location, open_location, direction ]
      properties:
        start_time:
          type: string
          format: date-time
        open_price:
          type: number
        high_price:
          type: number
        low_price:
          type: number
        close_price:
          type: number
        volume:
          type: number
        size_body_in_percent:
          type: number
        close_location:
          type: number
        open_location:
          type: number
        direction:
          type: integer
          enum:
            - -1
            - 0
            - 1
    IndicatorItem:
      type: object
      required: [ datetime,  value ]
      properties:
        datetime:
          type: string
          format: date-time
        value:
          type: number
    PricesResponse:
      type: array
      items:
        $ref: "#/components/schemas/PriceResponse"
    PriceResponse:
      type: object
      required: [ symbol, exchange, value ]
      properties:
        symbol:
          type: string
          description: Name symbol
        exchange:
          type: string
          description: Name exchange
        value:
          type: number
          description: Last price value
    SymbolInfoResponse:
      type: object
      required: [ symbol, exchange, base_asset, quote_asset, is_exist, funding_rate, countdown_funding_time, countdown_funding_time_seconds ]
      properties:
        symbol:
          type: string
          description: Name symbol
        exchange:
          type: string
          description: Name exchange
        base_asset:
          type: string
          description: Base coin
        quote_asset:
          type: string
          description: Quote coin
        is_exist:
          type: boolean
          description: Symbol exist in exchange
        funding_rate:
          type: number
          description: Funding rate for future symbol, if not future then 0
        next_funding_time:
          type: string
          format: date-time
        countdown_funding_time_seconds:
          type: number
          description: Countdown funding time in seconds, if not future then 0
        countdown_funding_time:
          type: string
          description: Countdown funding time, if not future then 0
    TradingSide:
      type: string
      enum: [ long, short ]
      description: Направление позиции
    TradingPosition:
      type: object
      required: [ side, volume, entry_price, margin, leverage ]
      properties:
        side:
          $ref: '#/components/schemas/TradingSide'
        volume:
          type: number
          description: Объём в базовом активе
        entry_price:
          type: number
          description: Средняя цена входа (USDT)
        margin:
          type: number
          description: Залог (USDT)
        leverage:
          type: number
          description: Плечо
    TradingAddOn:
      type: object
      required: [ price ]
      properties:
        price:
          type: number
          description: Цена докупки (USDT)
        volume:
          type: number
          description: Доп. объём; если 0 — считается из margin
        margin:
          type: number
          description: Доп. залог (USDT)
    TradingAvgEntryPriceRequest:
      type: object
      required: [ entry_volume, entry_price, new_volume, new_price ]
      properties:
        entry_volume:
          type: number
        entry_price:
          type: number
        new_volume:
          type: number
        new_price:
          type: number
    TradingAvgEntryPriceBySumRequest:
      type: object
      required: [ entry_volume, entry_price, sum, leverage, new_price ]
      properties:
        entry_volume:
          type: number
        entry_price:
          type: number
        sum:
          type: number
          description: Сумма залога докупки (USDT)
        leverage:
          type: number
        new_price:
          type: number
    TradingAvgEntryPriceResponse:
      type: object
      required: [ avg_entry_price ]
      properties:
        avg_entry_price:
          type: number
    TradingVolumeFromMarginRequest:
      type: object
      required: [ margin, leverage, price ]
      properties:
        margin:
          type: number
        leverage:
          type: number
        price:
          type: number
    TradingVolumeResponse:
      type: object
      required: [ volume ]
      properties:
        volume:
          type: number
    TradingLiquidationPriceRequest:
      type: object
      required: [ side, volume, entry_price, margin ]
      properties:
        side:
          $ref: '#/components/schemas/TradingSide'
        volume:
          type: number
        entry_price:
          type: number
        margin:
          type: number
        maintenance_margin_rate:

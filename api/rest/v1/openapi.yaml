openapi: 3.0.3
info:
  title: Crypto Polymath REST API
  # The description is rendered as markdown by the documentation page, so the
  # section about rate limits lives here rather than in a comment: a client reads
  # the contract, not this file.
  description: |
    Crypto Polymath REST api for external services.

    ## Rate limits

    Every endpoint accepts the optional `X-Token` request header. The token
    identifies the caller and affects nothing but how often requests may be sent:

    | Request | Limit |
    | --- | --- |
    | without `X-Token` | 10 requests per minute |
    | with `X-Token` | depends on the pricing plan of the token |

    The anonymous quota may be spent at once: ten requests in a row are allowed,
    after which the quota refills by one request every six seconds.

    Anonymous requests are counted per client IP address, and one counter is
    shared by all endpoints: walking different paths does not reset it. Once the
    limit is exceeded the API answers `429 Too Many Requests` and sets the
    `Retry-After` header to the number of seconds to wait.

    A token is issued together with a pricing plan, and the plan defines its
    quota. Handle `429` in any case: the same answer is returned when a plan
    quota runs out.
  version: 1.0.0
  # The service mark next to the name on the documentation page: the x-logo
  # extension is understood by Redoc, which renders /docs/api. Code generators
  # ignore the field. The link is relative because the contract and the mark are
  # served by the same server.
  x-logo:
    url: /static/img/icon.svg
    altText: Crypto Polymath

servers:
  - url: localhost/api/v1
    description: Local server for development
  - url: http://www.cryptopolymath.org/api/v1
    description: Production server

# The token is optional, and OpenAPI has only one way to say that: the empty
# requirement in the list permits an anonymous call, the second one permits a call
# with the header. Without the empty entry, client generators would treat the
# token as mandatory.
security:
  - { }
  - TokenHeader: [ ]

paths:

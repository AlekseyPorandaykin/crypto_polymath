components:
  securitySchemes:
    # The scheme describes frequency rather than access rights: the data is the
    # same with and without a token, only the allowed number of requests differs.
    TokenHeader:
      type: apiKey
      in: header
      name: X-Token
      description: |
        Token identifying the caller, issued together with a pricing plan.
        Anonymous requests are limited to 10 requests per minute per IP address;
        for requests carrying this header the limit depends on the pricing plan
        of the token.
  schemas:
    AnalysisResponse:
      type: array
      items:
        $ref: '#/components/schemas/AnalysisItem'
    AnalysisItem:
      type: object
      required: [ datetime,  value ]
      properties:
        datetime:
          type: string
          format: date-time
        value:
          type: number
    ServerInfoResponse:
      type: object
      required: [ time, symbols, exchanges, units, intervals, depths, indicator_depth, indicators, analysis ]
      properties:
        time:
          type: string
          format: date-time
        symbols:
          type: array
          items:
            type: string
            description: Support symbol
        exchanges:
          type: array
          items:
            type: string
            description: Support exchange
        units:
          type: array
          items:
            type: string
            description: Support unit
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/UnitIntervals'
        depths:
          type: array
          items:
            type: integer
            description: Support depth
        indicator_depth:
          type: array
          items:
            type: integer
            description: Support indicator depth
        indicators:
          type: array
          items:
            $ref: '#/components/schemas/IndicatorInfo'
        analysis:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisInfo'
    AnalysisInfo:
      type: object
      required:
        - name
        - description
        - depth
        - indicator_depth
      properties:
        name:
          type: string
          description: Name analysis
        description:
          type: string
        depth:
          type: array
          items:
            type: integer
            description: Depth analysis
        indicator_depth:
          type: array
          items:
            type: integer
            description: Depth indicator
    IndicatorInfo:
      type: object
      required:
        - name
        - description
        - depth
      properties:
        name:
          type: string
          description: Name indicator
        description:
          type: string
        depth:
          type: array

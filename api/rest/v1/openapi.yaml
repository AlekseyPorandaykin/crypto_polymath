  # The only endpoint that accepts something from a person rather than returning
  # market data: the contact form on the landing page posts here. It answers 202
  # rather than 200 on purpose — the message is accepted for delivery, and the
  # answer says nothing about when the team reads it.
  /contact:
    post:
      tags:
        - contact
      summary: Send a message to the team
      description: |
        Accepts a message from the contact form: the sender address, a subject and
        the text. Delivery is asynchronous, so a successful answer means the message
        was accepted, not that it has already been read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactMessageRequest'
            examples:
              normal:
                $ref: '#/components/examples/ContactMessageRequest'
      responses:
        202:
          description: message accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageResponse'
        400:
          description: invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        429:
          description: too many requests, rate limit exceeded (10 requests per minute without X-Token, plan quota with it)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

version: "3"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/prometheus/dashboards/crypto_polymath.json:/var/lib/grafana/dashboards/crypto_polymath.json
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention=200h' #Чистим TSDB каждый 200ч
      - '--web.enable-lifecycle'
    restart: unless-stopped
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/crypto_polymath.json"
    expose:
      - 9090
    ports:
      - "9090:9090"
      - "64000:64000"
    networks:
      - app
  grafana:
    image: grafana/grafana
    container_name: grafana
    volumes:
      - ./storage/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - app
networks:
  app:
    driver: bridge
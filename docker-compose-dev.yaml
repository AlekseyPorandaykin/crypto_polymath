services:
  app-external-v1:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    environment:
      - CGO_ENABLED=0
    ports:
      - "8080:8080"
      - "8085:8085"
      - "80:80"
    command:
      - "api"
      - "external-v1"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  app-loader:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    environment:
      - METRIC_PORT=8081
      - CGO_ENABLED=0
    ports:
      - "8081:8081"
    command:
      - "daemon"
      - "loader"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  app-calculator:
    build:
      context: ./
      dockerfile: ./deployments/app.Dockerfile
    environment:
      - METRIC_PORT=8082
      - CGO_ENABLED=0
    ports:
      - "8082:8082"
    command:
      - "daemon"
      - "calculator"
    restart: unless-stopped         # политика рестарта
    networks:
      - application
  rabbit-mq:
    image: rabbitmq:3-management
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: crypto_developer_messages
    networks:
      - application
  postgres:
    image: postgres
    restart: unless-stopped         # политика рестарта
    ports:
      - "3307:3306"
      - "5433:5432"
    environment:
      POSTGRES_DB: crypto_app
      POSTGRES_USER: crypto_app
      POSTGRES_PASSWORD: crypto_developer
      PGDATA: /data/pgdata
    networks:
      - application
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8090:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
networks:
  application:
    driver: bridge
